<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Explore</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#135bec" },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                },
            },
        }
    </script>
    <script src="app.js" defer></script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="app-container" class="bg-white dark:bg-[#101622] min-h-screen relative flex flex-col">

        <!-- Desktop Header -->
        <header
            class="hidden md:flex sticky top-0 z-50 bg-white/90 dark:bg-[#101622]/90 backdrop-blur-xl border-b border-gray-100 dark:border-gray-800 px-8 py-4 items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div
                        class="bg-primary p-2 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-white text-2xl">home_work</span>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Rentify</h1>
                </a>
            </div>

            <nav class="flex items-center gap-8 text-gray-500 font-medium">
                <a href="index.html" class="hover:text-primary transition-colors">Marketplace</a>
                <a href="filters.html" class="text-primary font-bold">Explore</a>
                <a href="#" class="hover:text-primary transition-colors">Saved</a>
                <a href="chat.html" class="hover:text-primary transition-colors">Messages</a>
            </nav>

            <a href="profile.html" class="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 p-1 pr-4 rounded-full">
                <div class="size-8 rounded-full overflow-hidden border-2 border-white">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAU0WBI3Zsk8CoNujzvZLFNYa55VlCKsC-PgS8OykghBr2dIoDRpmDhsZZGFeCSAAljCS1SY3iYHPblE9nFHhSkLLjVlqzuw-VVNfJbQ62bjUurZFCCuDJGw4d-_awUQgCtLtOZ0eWc2x6LPe9epEt6dfhVCcOgJHrQmPUDVJ5MvXLDL1L8BNQJS3qIFgu9QOfUUZeZltgI1GzA_C5nmxpSoX8KKlrjWlw-9NT4KmbLXbYknDgsJSHziHJ6AwFGYPRj_VY6rwzJ0sM"
                        class="w-full h-full object-cover">
                </div>
                <span class="text-sm font-semibold italic">My Account</span>
            </a>
        </header>

        <!-- Mobile Header -->
        <header
            class="md:hidden sticky top-0 z-40 bg-white dark:bg-[#101622] border-b border-gray-200 dark:border-gray-800">
            <div class="flex items-center p-4 pb-2 justify-between">
                <a href="index.html"
                    class="text-gray-900 dark:text-white flex size-12 shrink-0 items-center justify-start">
                    <span class="material-symbols-outlined">arrow_back_ios</span>
                </a>
                <h2 class="text-gray-900 dark:text-white text-lg font-bold flex-1 text-center">Explore</h2>
                <div class="w-12"></div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-12 pb-24">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-12 items-start">
                
                <!-- Filters Sidebar (Desktop) / Top Section (Mobile) -->
                <div class="space-y-8 md:sticky md:top-28">
                    <!-- Price Range -->
                    <section>
                        <h3 class="text-xl font-bold mb-6">Price Range</h3>
                        <div id="price-range-slider"
                            class="bg-gray-100 dark:bg-gray-800/50 p-6 md:p-8 rounded-3xl border border-gray-100 dark:border-gray-800 transition-all select-none">
                            <div class="relative h-2 w-full bg-gray-200 dark:bg-gray-700 rounded-full flex items-center">
                                <div id="rangeFill" class="absolute h-full bg-primary rounded-full transition-all duration-75"></div>
                                <div id="minThumb"
                                    class="absolute -top-2 size-6 bg-white border-4 border-primary rounded-full shadow-lg ring-4 ring-primary/10 -translate-x-1/2 pointer-events-none transition-all duration-75">
                                </div>
                                <div id="maxThumb"
                                    class="absolute -top-2 size-6 bg-white border-4 border-primary rounded-full shadow-lg ring-4 ring-primary/10 -translate-x-1/2 pointer-events-none transition-all duration-75">
                                </div>
                                <input type="range" id="priceRangeMin" min="1500" max="12000" step="500" value="3000"
                                    class="absolute w-full h-full opacity-0 cursor-pointer pointer-events-auto z-20" />
                                <input type="range" id="priceRangeMax" min="1500" max="12000" step="500" value="12000"
                                    class="absolute w-full h-full opacity-0 cursor-pointer pointer-events-auto z-20" />
                            </div>
                            <div class="flex justify-between mt-6 text-base font-black">
                                <span id="minPriceLabel" class="text-primary">KES 3,000</span>
                                <span id="maxPriceLabel" class="text-primary">KES 12,000+</span>
                            </div>
                        </div>
                    </section>

                    <!-- Property Type -->
                    <section>
                        <h3 class="text-xl font-bold mb-4">Property Type</h3>
                        <div class="flex flex-wrap gap-2">
                            <button data-type="All"
                                class="property-type-btn active px-6 py-3 rounded-2xl bg-primary text-white font-bold shadow-lg shadow-primary/20 transition-all">All Housing</button>
                            <button data-type="Apartment"
                                class="property-type-btn px-6 py-3 rounded-2xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 font-bold hover:border-primary transition-all text-gray-400 dark:text-gray-400">Apartment</button>
                            <button data-type="Villas"
                                class="property-type-btn px-6 py-3 rounded-2xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 font-bold hover:border-primary transition-all text-gray-400 dark:text-gray-400">Villas</button>
                        </div>
                    </section>

                    <!-- Bedrooms Counter -->
                    <section>
                        <h3 class="text-xl font-bold mb-4">Bedrooms</h3>
                        <div class="flex items-center justify-between bg-gray-100 dark:bg-gray-800/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
                            <span class="font-bold text-gray-700 dark:text-gray-300">Min Bedrooms</span>
                            <div class="flex items-center gap-4">
                                <button type="button" id="btn-bedroom-dec"
                                    class="size-10 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 font-black text-xl hover:border-primary hover:text-primary transition-all flex items-center justify-center active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">
                                    -
                                </button>
                                <span id="bedroom-count-display" class="font-black text-lg w-8 text-center text-primary">Any</span>
                                <button type="button" id="btn-bedroom-inc"
                                    class="size-10 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 font-black text-xl hover:border-primary hover:text-primary transition-all flex items-center justify-center active:scale-95">
                                    +
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Amenities -->
                    <section>
                        <h3 class="text-xl font-bold mb-4">Amenities</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <label
                                class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl cursor-pointer hover:border-primary transition-all group">
                                <input type="checkbox" value="WiFi"
                                    class="amenity-checkbox rounded-full text-primary focus:ring-primary size-5 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span
                                    class="text-sm font-bold text-gray-500 group-hover:text-primary transition-colors">WiFi</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl cursor-pointer hover:border-primary transition-all group">
                                <input type="checkbox" value="Gym"
                                    class="amenity-checkbox rounded-full text-primary focus:ring-primary size-5 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span
                                    class="text-sm font-bold text-gray-500 group-hover:text-primary transition-colors">Gym</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl cursor-pointer hover:border-primary transition-all group">
                                <input type="checkbox" value="Pool"
                                    class="amenity-checkbox rounded-full text-primary focus:ring-primary size-5 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span
                                    class="text-sm font-bold text-gray-500 group-hover:text-primary transition-colors">Pool</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl cursor-pointer hover:border-primary transition-all group">
                                <input type="checkbox" value="Parking"
                                    class="amenity-checkbox rounded-full text-primary focus:ring-primary size-5 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span
                                    class="text-sm font-bold text-gray-500 group-hover:text-primary transition-colors">Parking</span>
                            </label>
                        </div>
                    </section>

                    <section class="hidden md:block">
                        <button id="reset-filters-btn"
                            class="w-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-4 rounded-[24px] hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                            Reset All Filters
                        </button>
                    </section>
                </div>

                <!-- Results Area -->
                <div class="md:col-span-2 space-y-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-black">
                            <span id="location-result-count">0 Results</span> 
                            <span class="text-sm font-medium text-gray-500">in Westlands, Nairobi</span>
                        </h2>
                    </div>

                    <!-- Search Bar -->
                    <div
                        class="bg-gray-100 dark:bg-gray-800 rounded-3xl p-2 pl-6 flex items-center gap-4 border-2 border-transparent focus-within:border-primary transition-all">
                        <span class="material-symbols-outlined text-gray-400">search</span>
                        <input id="location-search" class="flex-1 bg-transparent border-none focus:ring-0 text-lg font-medium outline-none"
                            placeholder="Search by title or location..." />
                        <button id="location-search-button" type="button"
                            class="bg-primary text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">Search</button>
                    </div>

                    <!-- Auto-scroll Results Container -->
                    <div id="results-scroll-container" class="max-h-[75vh] overflow-y-auto pr-2 space-y-6 rounded-3xl scroll-smooth">
                        <div id="location-search-results" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <!-- Dynamic Results Populated via JavaScript -->
                        </div>
                        <p id="location-no-results" class="hidden col-span-full rounded-3xl border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-800 p-8 text-center text-sm font-semibold text-gray-500">
                            No homes match your search criteria. Try adjusting your filters.
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
