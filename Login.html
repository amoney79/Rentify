<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Login</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff  0%, #f3f4f6 100%);
            padding: 1.5rem;
        }

        /*Desktop split-screen layout container*/
        .auth-wrapper{
            display: flex;
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        /* Desktop Branding Panel (Hidden on Mobile)*/
        .brand-panel{
            flex: 1;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-panel h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .brand-panel p{
            font-size: 1rem;
            color: #dbeafe;
            line-height: 1.5;
        }
        /*Form Container*/
        .form-panel {
            flex:1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        /*Tab switcher */
        .tab-group {
            display: flex;
            background-color: #f3f4f6;
            border-radius: 10px;
            padding: 0.25rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border:none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b7280;
            cursor: painter;
            transition: all 0.2s ease;
        }
        .tab-btn.active{
            background-color: #ffffff;
            color: #111827;
            box-shadow: 0.2px 6px rgba(0, 0, 0, 0.06);
        }
        .form-header h2{
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 0.35rem
        }
        .form-header p {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .hidden {
            display: none !important;
        }
        
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            font-size: 1rem; /* 16px prevents iOS auto-zoom on focus */
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color:#6b7280;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.25rem;
        }
        .toggle-password:hover {
            color: #111827;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.55rem;
            background-color: #2563eb;
            color:#ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit-hover {
            background-color: #1d4ed8;
        }

        .message {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }

        .message-error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .message-success {
            display: block;
            background-color: #dcfce7;
            color: #166534;
        }

        /* Mobile & Tablet Responsive Breakpoint */
        @media (max-wid)

    </style>
</head>
<body>
    
</body>
</html>
