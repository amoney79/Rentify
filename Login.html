<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Login</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff  0%, #f3f4f6 100%);
            padding: 1.5rem;
        }

        /*Desktop split-screen layout container*/
        .auth-wrapper{
            display: flex;
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        /* Desktop Branding Panel (Hidden on Mobile)*/
        .brand-panel{
            flex: 1;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-panel h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .brand-panel p{
            font-size: 1rem;
            color: #dbeafe;
            line-height: 1.5;
        }
        /*Form Container*/
        .form-panel {
            flex:1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        /*Tab switcher */
        .tab-group {
            display: flex;
            background-color: #f3f4f6;
            border-radius: 10px;
            padding: 0.25rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border:none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b7280;
            cursor: painter;
            transition: all 0.2s ease;
        }
        .tab-btn.active{
            background-color: #ffffff;
            color: #111827;
            box-shadow: 0.2px 6px rgba(0, 0, 0, 0.06);
        }
        .form-header h2{
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 0.35rem
        }
        .form-header p {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .hidden {
            display: none !important;
        }
        .
        label {
            display: block;
            margin-bottom: 0.4rem;
        }

    </style>
</head>
<body>
    
</body>
</html>
