<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Login</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff  0%, #f3f4f6 100%);
            padding: 1.5rem;
        }

        /*Desktop split-screen layout container*/
        .auth-wrapper{
            display: flex;
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        /* Desktop Branding Panel (Hidden on Mobile)*/
        .brand-panel{
            flex: 1;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-panel h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .brand-panel p{
            font-size: 1rem;
            color: #dbeafe;
            line-height: 1.5;
        }
        /*Form Container*/
        .form-panel {
            flex:1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        /*Tab switcher */
        .tab-group {
            display: flex;
            background-color: #f3f4f6;
            border-radius: 10px;
            padding: 0.25rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border:none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b7280;
            cursor: painter;
            transition: all 0.2s ease;
        }
        .tab-btn.active{
            background-color: #ffffff;
            color: #111827;
            box-shadow: 0.2px 6px rgba(0, 0, 0, 0.06);
        }
        .form-header h2{
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 0.35rem
        }
        .form-header p {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .hidden {
            display: none !important;
        }
        
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            font-size: 1rem; /* 16px prevents iOS auto-zoom on focus */
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color:#6b7280;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.25rem;
        }
        .toggle-password:hover {
            color: #111827;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.55rem;
            background-color: #2563eb;
            color:#ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit-hover {
            background-color: #1d4ed8;
        }

        .message {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }

        .message-error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .message-success {
            display: block;
            background-color: #dcfce7;
            color: #166534;
        }

        /* Mobile & Tablet Responsive Breakpoint */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                background: #f3f4f6;
            }

            .auth-wrapper {
                flex-direction: column;
                max-width: 420px;
            }

            .brand-panel {
                display: none;
            }

            .form-panel {
                padding: 1.75rem 1.5rem;
            }
        }

    </style>
</head>
<body>

    <div  class="auth-wrapper" >
        <!--Deskttop left side panel-->
        <div class="brand-panel" >
            <h1 id="bramdTitle">Welomek</h1>
            <p id="brandSubtitle">Sign in to access your dashboard, manage your settings, and pick up right where you left off</p>
        </div>

        <!--Form Panel-->
        <div class="form-panel" >
            <div class="tab-group" role="tablist" >
                <button type="button" class="tab-btn active" id="loginTab" role="tab" aria-selected="true">Sign In</button>
                <button type="button" class="tab-btn" id="SignupTab" role="tab" aria-selected="false">Create Account</button>
            </div>

            <div class="form-header" >
                <h2 id="formTitle">Sign in to your Account</h2>
                <p id="formSubtitle">Enter your credentals below to continue.</p>
            </div>

            <form id="autoForm" novalidate >
                <!--Sign-Up Onlyy: Full Name -->
                <div class="form-group hidden" id="nameGroup" >
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placehholder="Jane Doe" autocomplete="name" />
                </div>

                <!--Shared: Email  -->
                <div class="form-group" >
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
                </div>

                <!--Shared:Password -->
                <div class="form-group" >
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="........" autocomplete="current-password" required />
                        <button type="button" class="toggle-password" id="togglePassword">Show</button>
                    </div>
                </div>

                <!--Sign-Up Only: Confirm Password -->
                <div class="form-group hidden" id="confirmPasswordCroup">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placceholder="........" autocomplete="new-password" />

                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
                <div id="statusMessage" class="message" role="alert"></div>
            </form>
        </div>
    </div>

    <script>
        let isSignUpMode = false;

        // elements
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const brandTitle = document.getElementById("brandTitle");
        const brandSubtitle = document.getElementById("brandSubtitle");
        const formTitle = document.getElementById("formTitle");
        const formSubtitle = document.getElementById("formSubtitle");
        const nameGroup = document.getElementById("nameGroup");
        const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
        const submitBtn = document.getElementById("submitBtn");
        const statusMessage = document.getElementById("statusMessage");

        const authForm = document.getElementById("autthForm");
        const fullNameInput = document.getElementById(fullName);
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const togglePasswordBtn = document.getElementById("togglePassword");

        // switch Tabs
        function setMode (signUp) {
            isSignUpMode = signUp;
            clearMessage();

            if(isSignUpMode) {
                signupTab.classList.add("active");
                signupTab.setAttribute("aria-selected", "true");
                loginTab.classList.add("active");
                loginTab.setAttribute("aria-selected", "false");

                brandTitle.textContent = "Join us Today!";
                brandSubtitle.textContent = "Create an account in seconds to unlock all features and sync across all your devices.";
                formTitle.textContent = "Create an account";
                formSubtitle.textContent = "Fill in your details below to get started.";
                submitBtn.textContent = "create Account";

                nameGroup.classList.remove("hidden");
                confirmPasswordGroup.classList.remove("hidden");
                passwordInput.setAttribute("autocomplete", "new-password");
            } else {
                loginTab.classList.add("active");
                loginTab.setAttribute("aria-selected", "true");
                signupTab.classList.remove("active");
                signupTab.setAttribute("aria-selected", "false");

                brandTitle.textContent = "Welcome Back!";
                brandSubtitle.textContent = "Sign in to access your dashboard,manage your settings,and pick up right where you left off.";
                formTitle.textContent = "Sign in to your account";
                formSubtitle.textContent = "Enter your credentials below to continue.";
                submitBtn.textContent = "sign In";

                nameGroup.classList.add("hidden");
                confirmPasswordGroup.classList.add("hidden");
                passwordInput.setAttribute("autocomplete", "current-password");

            }
        }

        loginTab.addEventListener("click", () => setMode(false));
        signupTab.addEventListener("click", () => setMode(false));

        //Toggle password Visibility
        togglePasswordBtn.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            confirmPasswordGroup.type = isHidden ? "text" : "password";
            togglePasswordBtn.textContent = isHidden ? "Hide" :  "Show";
        });

        //Form Validation & SSubmission
        authForm.addEventListener("Submit", (event) => {
            event.preventDefault();
            clearMessage();

            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if(isSignUpMode && fullName.length < 2) {
                showMessage("Please entter your full name,", "error");
                return;
            }
             if(!email || !/^[^\s@]+@[^\s@]+.[^\s@]+$/.test(email)) {
                showMessage("Please enter a valid email address.","error");
                return;
             }
             if(password.length < 6 ) {
                showMessage("Password must be at least 6 characters.", "error")
                return;

             }
             if(isSignUpMode && password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
             }

             //Ready for backend fetch() integration 
             const action = isSignUpMode ? "Account created! Redirectting..." : "Signed in! Redirecting...";
             showMessage(acttion, "success");
        });

        function showMessage(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = `message ${type}`;
        }

        function clearMessage() {
            statusMessage.textContent = "";
            statusMessage.className = "message";
        }
    </script>
    
</body>
</html>
