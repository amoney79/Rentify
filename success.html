<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Booking Confirmed</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#135bec" },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                },
            },
        }
    </script>
    <script src="app.js" defer></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="app-container" class="bg-white dark:bg-[#101622] min-h-screen relative flex flex-col items-center justify-center p-6 text-center">
        
        <div class="max-w-xl w-full space-y-8 animate-in fade-in zoom-in duration-700">
            <!--Dynamic  Hero Icon -->
            <div class="relative size-32 md:size-48 mx-auto mb-12">
                <div id="hero-ping" class="absolute inset-0 bg-primary/20 rounded-full animate-ping"></div>
                <div id="hero-circle" class="relative size-full bg-primary text-white rounded-full flex items-center justify-center shadow-2xl shadow-primary/40">
                    <span id="hero-icon" class="material-symbols-outlined !text-6xl md:text-8xl font-black">check_circle</span>
                </div>
            </div>
 
            <!--Dynamic Title & Subtitle-->
            <div class="space-y-4">
                <h1 id="status-title" class="text-4xl md:text-7xl font-black italic tracking-tight leading-none">Booking<br/>Confirmed!</h1>
                <p id="status-message" class="text-gray-500 text-lg md:text-xl font-medium max-w-sm mx-auto">Your viewing is scheduled. You'll receive a confirmation SMS in a few seconds.</p>
            </div>

            <!-- Dynamic Details | Receipt Card(completely replaced per state) -->
            <div id="details-card" class="bg-gray-50 dark:bg-gray-800/50 p-6 md:p-8 rounded-[32px] md:rounded-[40px] border border-gray-100 dark:border-gray-800 space-y-5 shadow-sm text-left" >
                <!--Rows injected by success.js-->
            </div>

            <!--Dynamic Action Buttons-->
            <div class="pt-8 space-y-4">
                <a href="index.html" class="w-full bg-primary text-white font-black py-5 rounded-[24px] shadow-2xl shadow-primary/40 flex items-center justify-center gap-2 hover:scale-[1.05] transition-all text-xl">
                    Back to Marketplace <span class="material-symbols-outlined">home</span>
                </a>
                <a href="chat.html" class="block text-primary font-black uppercase tracking-widest text-xs hover:underline">Message Agent</a>
            </div>
        </div>

        <div class="absolute bottom-12 text-gray-400 text-[10px] font-bold uppercase tracking-[0.4em]">Rentify Technologies &copy; 2026</div>
    </div>
    <script src="rentify-api.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            //supports ?type=payment | ?type==schedule(or booking) | ?type=landlord |?type=verification
            const type =(params.get('type') || 'schedule').toLowerCase();

            //fallback to saved localStorage state if URL params aren't passed
            const savedBooking = JSON.parse(localStorage.getItem('rentifyBooking') || '{}');

            //DOM targets
            const heroPing = document.getElementElementById('hero-ping');
            const heroCircle = document.getElementById('hero-circle');
            const heroIcon = document.getElementById('hero-icon');
            const statusTitle = document.getElementById('status-title');
            const statusMessage = document.getElementById('status-message');
            const detailsCard = document.getElementById('detail-card');
            const primaryAction = document.getElementById('primary-action');
            const secondaryAction = document.getElementById('secondary-action');

            //Helper to build clean, responsive receipt rows
            function renderRows(row) {
                dettailsCard.style.display = 'block';
                detailsCard.innerHTML = rows.map((row, index) => `
                    <div class="flex justify-between items-center gap-4 text-sm md:text-lg ${index > 0 ? 'border-t border-gray-200/70 dark:border-gray-700 pt-5' : ''}">
                        <span class="text-gray-400 font-bold uppercase tracking-widest text-[10px] shrink-0">${row.label}</span>
                        <div class="font-black italic text-right ${row.highlight ? 'text-primary text-lg md:text-xl' : ''}">${row.value}</div>
                    </div>
                `).join('');
            }

            //PAYMENT SUCCESS & RECEIPT
            if(type === 'payment') {
                document.title = 'Rentify - Payment Receipt';
                document.className = 'relative size- full bg-emerald-600 text-whhite rounded-full flex items-center justify-center shaddow-2xl shadow-emerald-600/40';
                heroPing.className = 'absolute insect-0 bg-emerald-500/20 rounded-full animatte-ping';
                heroIcon.textContent = 'receipt_long';

                statusTitle.innerHTML = 'Payment<br/>Successful!';
                statusMessage.textContent = 'Your payment has been processed securely. Keep this official receipt for your records.';

                const amount = params.get('amount') || 'KES 1,250';
                const txId = params.get('txId') || 'TXN-' + Math.floor(100000 + Math.random()*900000);
                const property = params.get('property') || savedBooking.property || 'Silver Towers Unit 4B';
                const method = params.get('method') || 'Visa ....7878';
                const datePaid = params.get('date') || new Date().toLocaleDateString('en-US', {month: 'short',day: 'numeric',year: 'numeric'});

                renderRows([
                    {label: 'Amount Paid', value:amount,highlight: true },
                    {label: 'Receipt No.', value:txId },
                    {label: 'Property', value:property },
                    {label: 'Payment Method', value: method },
                    {label: 'Date', value: datePaid }
                ]);

                primaryAction.href = 'index.html';
                primaryAction.innerHTML = '<span>Back to Marketplace</span><span class="material-symbols-outlined">home</span>';
                secondaryAction.href = '#';
                secondaryAction.textContent = 'Download PDF Receipt';
                secondaryAction.onclick = (e) => {e.preventDefault(); window.print(); };

                //LANDLORD APPLICATION(AWAITING APPROVAL)
            } else if (type === 'landlord' || type === 'application') {
                document.title = 'Rentify - Appication Submitted';
                heroCircle.className = 'relative size-full bg-amber-500 text-white rounded-full flex items-center justtify-center shadow-amber-500/40';
                heroPing.className = 'absolute insect-0 bg-amber-400/20 rounded-full animate-ping';
                heroIcon.textContent = 'hourglass-top';

                statusTitle.innerHTML = 'Application<br/>Submitted!';
                statusMessage.textContent = 'Your LandLord onboarding & property listing are currently under Review by our Verification team.';

                const applicant = params.get('name') || 'Landlord Partner';
                const property = params.get('property') || 'New Property Listing';
                const appId = params.get('appId') || 'App-' + Math.floor(10000 + Math.random()* 900000);

                renderRows([
                    {label: 'Application ID', value: appId },
                    {label: 'Applicant', value: applicant },
                    {label: 'Property / Portfolio', value: property },
                    {
                        label: 'Current Status',
                        value: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs not-italic font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300">
                            <span class="size-2 rounded-full bg-amber-500 animate-pulse"></span>Awaiting Approval
                            </span>`       
                    },
                    {lable: 'Est. Review Time', value: '24 - 48 Hours'}
                ]);
                
            }
        });
    </script>
</body>
</html>
