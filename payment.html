<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Secure Payment</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#135bec" },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                },
            },
        }
    </script>
    <script src="app.js" defer></script>
    <script src="payment.js" defer></script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="app-container" class="bg-white dark:bg-[#101622] min-h-screen relative flex flex-col">

        <!--Header-->
        <header class="p-6 md:p-12 flex items-center justify-between">
            <a href="schedule.html"
                class="size-6 flex items-center justify-center rounded-2xl bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-primary transition-all shadow-sm"><span
                    class="material-symbols-outlined">arrow_back</span></a>
            <h2 class="text-xl font-black">Secure Checkout</h2>
            <div class="size-12 flex items-center justify-center text-primary"><span
                    class="material-symbols-outlined !text-3xl">lock</span></div>
        </header>

        <main class="flex-1 max-w-2xl mx-auto w-full p-4 md:px-0 space-y-8 pb-32">

            <!--Dynamic Amount Display summary card -->
            <div class="big-white dark:bg-slate-500/40 border border-slate-100/40 dark:border-slate-600 rounded-2xl p-3 md:p-4 text-center shadow-sm relative overflow-hidden">
                <p class="text-sm font-black uppercase tracking-[0.3em] text-gray-400">Viewing Fee Deposit</p>
                <div class="relative inline-block px-6 py-4 bg-primary/5 rounded-3xl border-2 border-primary/20">
                    <h1 id="display-amount" class="text-xl md:text-xl font-black text-primary italic leading-none">KES 150</h1>
                </div>
                <p id="property-subtitle" class="text-sm font-bold text-gray-500"></p>
            </div>

            <!--Payment Methods Selector-->
            <div class="space-y-4">
                <h3 class="text-xl font-black px-2">Payment Methods</h3>
                <div class="space-y-3">

                    <!--M-Pesa Option-->
                    <button type="button" id="btn-mpesa"
                        class="w-full p-4 border-3 border-primary bg-primary/5 rounded-2xl flex items-center justify-between group transition-all shadow-2xl shadow-primary/10">
                        <div class="flex items-center gap-4">
                            <div id="icon-wrap-mpesa"
                                class="size-10 bg-green-500 rounded-2xl flex items-center justify-center text-white shadow-lg">
                                <span class="material-symbols-outlined !text-3xl">smartphone</span></div>
                            <div id="text-wrap-mpesa" class="text-left">
                                <p class="text-xl font-black italic">M-Pesa Mobile Money</p>
                                <p class="text-sm text-gray-500 font-medium tracking-tight">Instant Confirmation</p>
                            </div>
                        </div>
                        <div id="radio-mpesa" class="size-6 border-3 border-primary rounded-full flex items-center justify-center">
                            <div class="size-3 bg-primary rounded-full animate-pulse"></div>
                        </div>
                    </button>

                    <!--Visa /Bank card Option-->
                    <button type="button" id="btn-card"
                        class="w-full p-6 border-2 border-gray-100 dark:border-gray-800 rounded-[32px] flex items-center justify-between hover:border-primary transition-all group">
                        <div class="flex items-center gap-6">
                            <div id="icon-wrap-card"
                                class="size-16 bg-blue-500 rounded-2xl flex items-center justify-center text-white opacity-50">
                                <span class="material-symbols-outlined !text-3xl">credit_card</span></div>
                            <div id="text-wrap-card" class="text-left text-gray-400">
                                <p class="text-xl font-black italic">Credit / Debit Card</p>
                                <p class="text-sm font-medium tracking-tight">Visa, Mastercard, Amex</p>
                            </div>
                        </div>
                        <div id="radio-card" class="size-8 border-2 border-gray-200 dark:border-gray-700 rounded-full"></div>
                    </button>
                </div>
            </div>

            <!--Dynamic Payment Details Form-->
            <form id="payment-form" class="space-y-6" novalidate>
                <div class="bg-gray-50 dark:bg-gray-800/40 p-6 md:p-8 rounded-[32px] border border-gray-100 dark:border-gray-800 space-y-5">
                    <div id="form-mpesa" class="space-y-4">
                        <div class="flex items-center justify-between">
                            <label for="phone-input" class="text-xs font-black uppercase tracking-widest text-gray-500">M-Pesa Phone Number</label>
                            <span class="text-[11px] font-bold text-green-600 bg-green-100 dark:bg-green-900/30 dark:text-green-400 px-2.5 py-0.5 rounded-full">Safaricom</span>
                        </div>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 font-black text-gray-500 text-base select-none">+254</span>
                            <input id="phone-input" type="tel" inputmode="tel" maxlength="11" autocomplete="tel-national" placeholder="712 345 678"
                                class="w-full pl-16 pr-4 py-6 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 font-bold text-lg focus:border-primary focus:ring-0">
                        </div>
                        <p class="text-xs text-gray-400">You will receive an M-Pesa PIN prompt on your phone after starting the payment.</p>
                    </div>

                    <div id="form-card" class="hidden space-y-4">
                        <div>
                            <label for="card-name-input" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Cardholder Name</label>
                            <input id="card-name-input" type="text" autocomplete="cc-name" placeholder="JANE DOE"
                                class="w-full px-4 py-3.5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 font-bold uppercase focus:border-primary focus:ring-0">
                        </div>
                        <div>
                            <label for="card-number-input" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Card Number</label>
                            <input id="card-number-input" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="5423 0000 0000 8890"
                                class="w-full px-4 py-3.5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 font-bold text-lg tracking-wider focus:border-primary focus:ring-0">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="card-expiry-input" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Expiry Date</label>
                                <input id="card-expiry-input" type="text" inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/YY"
                                    class="w-full px-4 py-3.5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 font-bold text-center focus:border-primary focus:ring-0">
                            </div>
                            <div>
                                <label for="card-cvv-input" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">CVV / CVC</label>
                                <input id="card-cvv-input" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="•••"
                                    class="w-full px-4 py-3.5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 font-bold text-center focus:border-primary focus:ring-0">
                            </div>
                        </div>
                    </div>
                    <p id="error-msg" class="hidden text-sm font-bold text-red-600" role="alert" aria-live="polite"></p>
                </div>

                <div class="fixed md:relative bottom-0 left-0 right-0 p-6 bg-white/90 dark:bg-[#101622]/90 backdrop-blur-xl md:bg-transparent md:p-0">
                    <button id="pay-submit-btn" type="submit"
                        class="w-full bg-primary text-white font-black py-5 rounded-[24px] shadow-2xl shadow-primary/40 flex items-center justify-center gap-2 hover:scale-[1.02] transition-all text-xl disabled:opacity-70 disabled:cursor-wait">
                        <span id="pay-btn-text">Pay with M-Pesa</span>
                        <span id="pay-btn-icon" class="material-symbols-outlined">arrow_forward</span>
                    </button>
                    <p class="text-center text-[10px] font-bold text-gray-400 uppercase mt-4 tracking-widest">PCI-DSS Compliant • 256-bit Encryption</p>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
